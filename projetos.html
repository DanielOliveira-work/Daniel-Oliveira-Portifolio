  <script>
    (function() {
      const t = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', t);
      document.documentElement.style.colorScheme = t;
      document.addEventListener('DOMContentLoaded', function() {
        const savedLang = localStorage.getItem('lang') || 'pt';
        document.querySelectorAll('.lang-option').forEach(b => b.classList.toggle('is-active', b.getAttribute('data-lang') === savedLang));
        document.body.setAttribute('data-theme', t);
      });
    })();
  </script>
  <link rel="stylesheet" href="styles.css?v=3">
  <style>
    /* Reset para esta página */
    html, body { margin: 0; padding: 0; min-height: 100vh; }
    body { display: flex; flex-direction: column; }
    body::before, body::after { display: none !important; }

    /* Fundo escuro padrão com leve tom quente como na imagem */
    body { background: #110e0d; }
    html[data-theme="light"] body,
    body[data-theme="light"] { background: #f0f2f8; }

    .gallery-container {
      flex: 1;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 4rem 2rem;
    }
    
    .gallery-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 2rem;
    }

    .gallery-title {
      font-family: 'Oswald', 'Bebas Neue', 'Impact', sans-serif;
      font-size: 1.8rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #dfd5c5;
      margin: 0;
    }
    
    .gallery-link {
      color: #cc4444;
      text-decoration: none;
      font-size: 0.9rem;
      transition: opacity 0.2s;
    }
    .gallery-link:hover { opacity: 0.8; }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 3rem 2rem;
    }

    .gallery-card {
      text-decoration: none;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      padding: 1.25rem;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.25);
      transition: all 0.3s ease;
    }

    html[data-theme="light"] .gallery-card,
    body[data-theme="light"] .gallery-card {
      background: rgba(255, 255, 255, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
    }

    .gallery-card:hover {
      transform: translateY(-5px);
      border-color: rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.06);
      box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.35);
    }

    html[data-theme="light"] .gallery-card:hover,
    body[data-theme="light"] .gallery-card:hover {
      border-color: rgba(255, 255, 255, 1);
      background: rgba(255, 255, 255, 0.7);
    }

    .gallery-img-wrapper {
      width: 100%;
      aspect-ratio: 16/10;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
    }


    .gallery-img {
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      transition: transform 0.5s ease;
    }

    .gallery-card:hover .gallery-img {
      transform: scale(1.05);
    }

    .gallery-info {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .gallery-name {
      margin: 0;
      font-family: 'Inter', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #dfd5c5;
      text-transform: uppercase;
    }

    .gallery-cat {
      font-family: 'Inter', sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      color: rgba(255,255,255,0.4);
      text-transform: uppercase;
    }

    @media (max-width: 768px) {
      .gallery-grid {
        grid-template-columns: 1fr;
      }
      .gallery-title {
        font-size: 1.5rem;
      }
      .gallery-container {
        padding: 2rem 1.5rem;
      }
    }
  </style>
</head>
